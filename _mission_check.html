<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>사명 자동 채움 점검</title>
<style>body{font:14px/1.6 -apple-system,sans-serif;padding:16px}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}</style>
</head><body>
<h1>3p.html 사명 자동 채움 점검</h1>
<pre id="log">점검 중…</pre>
<script>
var LS = '3pbinder_v1', FLAG = '3p.missionSeeded.v1';
var MISSION = '나는 살아 숨 쉬는 동안 배움과 성장을 멈추지 않고, 끝내 이루어내어 아이들에게 존경받는 엄마가 된다.';
var log = document.getElementById('log');
function line(s){ log.textContent += '\n' + s; }
function st(mission){
  return JSON.stringify({v:1,lastStep:1,life:{mission:mission,wish:'',values:[],areas:[{id:'a1',name:'건강',vision:''}]},years:{},months:{},weeks:{},days:{}});
}
function frame(src){
  return new Promise(function(res){
    var f = document.createElement('iframe');
    f.style.cssText = 'width:1000px;height:700px;border:1px solid #ccc';
    f.onload = function(){ setTimeout(function(){ res(f); }, 250); };
    f.src = src;
    document.body.appendChild(f);
  });
}
function readVal(f){
  try{ return f.contentWindow.document.querySelector('[data-k="life.mission"]').value; }catch(e){ return 'READ_ERROR:' + e.message; }
}
function goLife(f){
  return new Promise(function(res){
    try{
      var d = f.contentWindow.document;
      if (d.querySelector('[data-k="life.mission"]')) return res(true);
      var btns = d.querySelectorAll('nav button, button');
      for (var i=0;i<btns.length;i++){
        if (btns[i].textContent.indexOf('1. 평생 계획') >= 0){ btns[i].click(); break; }
      }
    }catch(e){}
    setTimeout(function(){ res(false); }, 400);
  });
}
function storedMission(){
  try{ var p = JSON.parse(localStorage.getItem(LS) || 'null'); return p && p.life ? String(p.life.mission) : '(none)'; }catch(e){ return 'PARSE_ERROR'; }
}
function flagSet(){ return localStorage.getItem(FLAG) === '1'; }

async function run(){
  var cases = [
    {n:'A 기존 저장O·사명 빈칸·플래그 없음 (유진님 폰 상황)',
     setup:function(){ localStorage.setItem(LS, st('')); localStorage.removeItem(FLAG); },
     check:function(v){ return v === MISSION; }},
    {n:'B 저장O·사명 빈칸·플래그 이미 있음 (사용자가 지운 뒤)',
     setup:function(){ localStorage.setItem(LS, st('')); localStorage.setItem(FLAG,'1'); },
     check:function(v){ return v === ''; }},
    {n:'C 저장O·사용자가 쓴 사명·플래그 없음 (덮어쓰면 안 됨)',
     setup:function(){ localStorage.setItem(LS, st('내가 직접 정한 사명')); localStorage.removeItem(FLAG); },
     check:function(v){ return v === '내가 직접 정한 사명'; }},
    {n:'D 저장 자체가 없음 (새 기기)',
     setup:function(){ localStorage.removeItem(LS); localStorage.removeItem(FLAG); },
     check:function(v){ return v === MISSION; }}
  ];
  var pass = 0;
  for (var i=0;i<cases.length;i++){
    var c = cases[i];
    localStorage.removeItem(LS); localStorage.removeItem(FLAG);
    c.setup();
    var f = await frame('3p.html?t=' + Date.now() + '-' + i);
    await goLife(f);
    var v = readVal(f);
    var saved = storedMission(), fl = flagSet();
    var ok = c.check(v);
    line((ok?'PASS':'FAIL') + ' | ' + c.n);
    line('   화면 입력칸 값: ' + JSON.stringify(v));
    line('   저장된 값: ' + JSON.stringify(saved) + ' / 플래그: ' + fl);
    if (ok) pass++;
    f.remove();
    await new Promise(function(r){ setTimeout(r, 400); });
  }
  line('결과: ' + pass + ' / ' + cases.length + ' 통과');
  localStorage.removeItem(LS); localStorage.removeItem(FLAG);
  document.title = 'RESULT ' + pass + '/' + cases.length;
}
run().catch(function(e){ line('ERROR ' + e.message); });
</script>
</body></html>
